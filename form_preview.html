<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Внешний вид формы</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f5f9;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --border: #d1d5db;
      --focus: #93c5fd;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top right, #dbeafe 0%, var(--bg) 35%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(100%, 460px);
      background: var(--card);
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      box-shadow: 0 16px 36px rgba(15, 23, 42, 0.12);
      padding: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.4rem;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .field {
      display: grid;
      gap: 6px;
      margin-bottom: 14px;
    }

    label {
      font-size: 0.9rem;
      font-weight: 600;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.95rem;
      background: #fff;
      transition: border-color .15s ease, box-shadow .15s ease;
      outline: none;
    }

    textarea { min-height: 90px; resize: vertical; }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--focus);
    }

    .actions {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .primary {
      background: var(--primary);
      color: #fff;
    }
  </style>
</head>
<body>
  <form class="card" aria-label="Контактная форма">
    <h1>Связаться с нами</h1>
    <p>Заполните форму, и мы ответим вам в течение рабочего дня.</p>

    <div class="field">
      <label for="name">Имя</label>
      <input id="name" name="name" type="text" placeholder="Иван Иванов" />
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" />
    </div>

    <div class="field">
      <label for="topic">Тема</label>
      <select id="topic" name="topic">
        <option>Вопрос по продукту</option>
        <option>Техническая поддержка</option>
        <option>Обратная связь</option>
      </select>
    </div>

    <div class="field">
      <label for="message">Сообщение</label>
      <textarea id="message" name="message" placeholder="Опишите ваш вопрос"></textarea>
    </div>

    <div class="actions">
      <button type="reset" class="secondary">Очистить</button>
      <button type="submit" class="primary">Отправить</button>
    </div>
  </form>
</body>
</html>
